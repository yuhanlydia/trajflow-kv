name: TANGO
backbone: models/Qwen2.5-VL-3B-Instruct
primary:
  target: v
  layers: last_8
  rank: 8
  alpha: 16
  learning_rate: 0.0001
  epochs: 10
  precision: bf16
  task_baseline: true
  energy_lambda: 3000
controls:
  - base
  - warm_start
  - action_ce
  - successful_only_ce
  - shuffled_return
  - sign_flipped_return
  - tango_fast
  - tango_energy
trajectory_ablation:
  horizons: [1, 3, 5, full]
  step_views: [all, first, final]
  remove_history: [false, true]
online:
  paired: true
  androidworld:
    preflight_cycles: 20
    pilot_tasks: 8
    pilot_seeds: 3
    main_tasks: 40
    main_seeds: 5
  miniwob:
    pilot_families: [click-color, click-button, click-button-sequence, click-tab]
    seeds_per_family: 100
statistics:
  bootstrap_samples: 10000
  confidence: 0.95
  cluster: task_id
  mcnemar: exact
gates:
  androidworld_delta_vs_ce_pp: 5
  miniwob_delta_vs_ce_pp: 3
  confidence_interval_lower_bound: 0
  mcnemar_p_max: 0.05
  retention_drop_pp_max: 1
  tpd_teacher_gain_recovery_min: 0.70

